server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Défense en profondeur : si la racine servie était un jour la source
    # (index.html à côté des configs) au lieu de `dist/`, ces fichiers
    # ne doivent jamais fuiter par HTTP. En déploiement normal seul
    # `dist/` est copié dans l'image (voir Dockerfile), donc ces règles
    # ne bloquent rien de légitime.
    location ~* ^/(package\.json|package-lock\.json|vite\.config\.js|Dockerfile|nginx\.conf|\.dockerignore) { deny all; access_log off; log_not_found off; }
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~ ~$ { deny all; access_log off; log_not_found off; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /cm-chessboard/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /data/ { expires 1h; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ /index.html; }
}
